server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted assets can be cached forever; the hash changes on every deploy.
    location ~* ^/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The shell page must never be served from cache; it is only used for client-side routing.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # Any other route the SPA handles client-side; serve index.html.
    location / {
        try_files /index.html =404;
    }

    # Assets that are missing should 404, not fall back to index.html.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webmanifest|wasm)$ {
        try_files $uri =404;
    }
}
